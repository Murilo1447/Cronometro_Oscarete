<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backrooms Countdown</title>
    <!-- Fonte estilo relógio digital -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container da Imagem de Fundo -->
    <div class="backrooms-container">
        <!-- O Cronômetro vai encaixar na tela do relógio -->
        <div class="clock-display">
            <!-- Widget do TickCounter Atualizado (ID 11225910) -->
            <a data-type="countdown" 
               data-id="11225910" 
               class="tickcounter" 
               style="display:block; left:0; width:100%; height:0; position:relative; padding-bottom:25%; margin:0 auto;" 
               title="ㅤ" 
               href="//www.tickcounter.com/">ㅤ</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
